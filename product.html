<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BWK • Pande Sawan Firebase</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1115;--card:#131b20;--border:#1d2630;--accent:#2f9cee;--bwk:#6ae08b;--text:#e6eef5;--muted:#8a9bb0}
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:var(--bg);color:var(--text);padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.header h1{font-size:20px;margin:0}.header h1 span{color:var(--bwk)}
.badge{background:#11291a;border:1px solid #1e4a2f;color:var(--bwk);padding:4px 10px;border-radius:20px;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:20px}
.prod{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.prod img{width:100%;height:180px;object-fit:cover;background:#0e151a}
.prod.info{padding:12px}.prod.name{font-weight:700;font-size:14px;margin:0 0 4px}.prod.price{color:var(--bwk);font-weight:600}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn-sec{background:#1c2a36;color:var(--text);border:1px solid var(--border)}
input{width:100%;background:#0e151a;border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);margin:6px 0 12px}
label{font-size:12px;color:var(--muted);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}.modal-box{background:#131b20;border:1px solid var(--border);border-radius:14px;padding:20px;width:100%;max-width:420px}
.hint{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
<h1><span>BWK</span> • Pande Sawan</h1>
<div><span class="badge" id="status">✅ Firebase Connected</span>
<button class="btn" onclick="openModal()">+ Tambah</button>
<a href="index.html" class="btn btn-sec" style="text-decoration:none;margin-left:6px">Home</a></div>
</div>
<div id="productGrid" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target==this)closeModal()">
<div class="modal-box">
<h3 style="margin:0 0 12px">Tambah Produk BWK</h3>
<label>Nama Produk (auto jadi BWK -...)</label>
<input id="pName" placeholder="Arit Baja Super">
<label>Harga Rp</label>
<input id="pPrice" type="number" placeholder="150000">
<label>Foto (Choose File max 500KB auto kompres)</label>
<input id="pFile" type="file" accept="image/*">
<div class="hint" id="fileHint">Pilih foto, >500KB auto kompres</div>
<img id="preview" style="width:100%;height:150px;object-fit:cover;border-radius:8px;display:none;margin-top:8px">
<div style="display:flex;gap:10px;margin-top:16px">
<button class="btn" id="saveBtn" onclick="saveProduct()" style="flex:1">Simpan ke Firebase</button>
<button class="btn btn-sec" onclick="closeModal()" style="flex:1">Batal</button>
</div><div id="saveStatus" class="hint" style="margin-top:10px"></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyD6rIm0FmOgIioG2UCwQ2xQtJHqj5i1I",
  authDomain: "restopro2026-60038.firebaseapp.com",
  databaseURL: "https://restopro2026-60038-default-rtdb.asia-southeast1.firebaseapp.com",
  projectId: "restopro2026-60038",
  storageBucket: "restopro2026-60038.firebasestorage.app",
  messagingSenderId: "336434967293",
  appId: "1:336434967293:web:ba55b927cd01aa0229c494"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
const productsRef = ref(db, 'bwk_products');
let compressedFile=null;let previewDataUrl="";
const pFile=document.getElementById('pFile');const preview=document.getElementById('preview');const fileHint=document.getElementById('fileHint');
pFile.addEventListener('change', async (e)=>{
  const file=e.target.files[0];if(!file)return;
  fileHint.textContent=`Memproses ${(file.size/1024).toFixed(0)}KB...`;
  const result=await compressImage(file,500);
  compressedFile=result.file;previewDataUrl=result.dataUrl;
  preview.src=previewDataUrl;preview.style.display='block';
  fileHint.textContent=`✅ Siap: ${(compressedFile.size/1024).toFixed(0)}KB dari ${(file.size/1024).toFixed(0)}KB`;
});
async function compressImage(file,maxKB){const maxBytes=maxKB*1024;let quality=0.9;let width=1024;let dataUrl=await fileToDataUrl(file);if(file.size<=maxBytes){const blob=await dataUrlToBlob(dataUrl,0.85,width);if(blob.size<=maxBytes)return{file:new File([blob],file.name,{type:'image/jpeg'}),dataUrl:await blobToDataUrl(blob)}}for(let i=0;i<6;i++){const blob=await dataUrlToBlob(dataUrl,quality,width);if(blob.size<=maxBytes||(quality<0.4&&width<600)){return{file:new File([blob],file.name.replace(/\..+$/,'.jpg'),{type:'image/jpeg'}),dataUrl:await blobToDataUrl(blob)}}quality-=0.15;if(quality<0.5)width=Math.floor(width*0.8)}const finalBlob=await dataUrlToBlob(dataUrl,0.5,600);return{file:new File([finalBlob],file.name.replace(/\..+$/,'.jpg'),{type:'image/jpeg'}),dataUrl:await blobToDataUrl(finalBlob)}}
function fileToDataUrl(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
function blobToDataUrl(blob){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}
function dataUrlToBlob(dataUrl,quality,maxWidth){return new Promise(resolve=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=h*(maxWidth/w);w=maxWidth}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);canvas.toBlob(b=>resolve(b),'image/jpeg',quality)};img.src=dataUrl})}
window.openModal=()=>{document.getElementById('modal').classList.add('open')}
window.closeModal=()=>{document.getElementById('modal').classList.remove('open');document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pFile').value='';preview.style.display='none';fileHint.textContent='Pilih foto, >500KB auto kompres';compressedFile=null;document.getElementById('saveStatus').textContent=''}
window.saveProduct=async()=>{
  const nameRaw=document.getElementById('pName').value.trim();const price=document.getElementById('pPrice').value.trim();
  if(!nameRaw){alert('Isi nama dulu beb!');return}if(!price){alert('Isi harga beb!');return}
  const saveBtn=document.getElementById('saveBtn');const saveStatus=document.getElementById('saveStatus');
  saveBtn.disabled=true;saveBtn.textContent='Uploading...';
  try{
    let imageUrl="";if(compressedFile){const storagePath=`bwk_products/${Date.now()}_${compressedFile.name}`;const storageRef=sRef(storage,storagePath);await uploadBytes(storageRef,compressedFile);imageUrl=await getDownloadURL(storageRef)}
    const finalName=`BWK - ${nameRaw}`;const newRef=push(productsRef);
    await set(newRef,{name:finalName,rawName:nameRaw,price:parseInt(price),imageUrl:imageUrl,imagePreview:imageUrl?"":previewDataUrl,createdAt:Date.now()});
    saveStatus.textContent="✅ Berhasil: "+finalName;setTimeout(()=>{closeModal();saveBtn.disabled=false;saveBtn.textContent='Simpan ke Firebase'},1000);
  }catch(err){
    console.error(err);if(previewDataUrl){try{const newRef=push(productsRef);await set(newRef,{name:`BWK - ${nameRaw}`,rawName:nameRaw,price:parseInt(price),imageUrl:"",imagePreview:previewDataUrl,createdAt:Date.now()});saveStatus.textContent="✅ Save base64 (Storage butuh rules)";setTimeout(()=>{closeModal();saveBtn.disabled=false;saveBtn.textContent='Simpan ke Firebase'},1000);return}catch(e2){}}
    saveStatus.textContent="❌ "+err.message;saveBtn.disabled=false;saveBtn.textContent='Simpan ke Firebase';
  }
}
function render(products){const grid=document.getElementById('productGrid');if(!products.length){grid.innerHTML=`<div style='grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)'>Belum ada produk BWK</div>`;return}grid.innerHTML=products.map(p=>`<div class="prod"><img src="${p.imageUrl||p.imagePreview||'https://via.placeholder.com/300?text=BWK'}" onerror="this.src='https://via.placeholder.com/300?text=BWK'"><div class="info"><p class="name">${p.name}</p><p class="price">Rp ${(p.price||0).toLocaleString('id-ID')}</p><button class="btn btn-sec" style="width:100%;margin-top:8px;font-size:12px" onclick="deleteProduct('${p.id}')">🗑️ Hapus</button></div></div>`).join('')}
onValue(productsRef,(snapshot)=>{const data=snapshot.val();if(!data){render([]);return}const list=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>b.createdAt-a.createdAt);render(list)});
window.deleteProduct=async(id)=>{if(!confirm('Hapus?'))return;await remove(ref(db,`bwk_products/${id}`))}
</script></body></html>
